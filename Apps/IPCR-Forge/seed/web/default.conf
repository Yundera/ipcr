# IPCR Forge landing page. Static, plus IPCR's published.json as /images.json.
# No nginx variables on purpose: this file is also safe to render as a Maison template.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /images.json {
        alias /srv/ipcr-state/published.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Only the page and its icon; nothing else under the state directory is reachable.
    location / {
        add_header Cache-Control "no-cache";
    }
}
