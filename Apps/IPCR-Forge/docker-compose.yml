name: ipcr-forge

# IPCR Forge — a forge whose images are served from IPFS and whose code is mirrored to Radicle,
# built on the store's Gitea app and (optionally) its Radicle app:
#
#   git push origin main v1.2.3                               (developer, plain git)
#     → gitea  (the Gitea app)             the source of truth: repositories, PRs, issues, users
#     → forge-runner (act_runner)          Gitea Actions: jobs with `runs-on: ipcr`
#     → forge-registry                     staging: localhost:5000/<owner>/<repo>:1.2.3 (internal only)
#     → ipcr-gateway follows that registry imports every tag into IPFS, publishes IPNS
#     → ipcr-kubo / ipcr-registry
#   docker pull ipcr.localhost:4767/ipns/<forge name>/<owner>/<repo>:1.2.3   (anyone)
#
#   gitea ──system webhook──▶ ipcr-forge ──rad init / git push rad──▶ radicle-node (the Radicle app)
#     every PUBLIC repository, one way, once the Radicle app is installed.
#
# What this listing expects, and nothing else (see docs/forge.md in ipcr-forge, "Two listings"):
#   - the Gitea app: `gitea:3000` on the shared network; it allows webhooks to `ipcr-forge`.
#     forge-setup signs in once as FORGE_GITEA_ADMIN / FORGE_GITEA_PASSWORD (default gitea_admin and
#     the server's app password) to mint the forge's tokens, its webhook, its OAuth2 app and this
#     runner's registration token. Without Gitea, the forge's page says so; nothing else breaks.
#   - the Radicle app, optional: its home, /DATA/AppData/radicle/home, mounted into the forge
#     service (Radicle's API is read-only: creating and pushing repositories takes the node's own
#     key, storage and control socket). Without it, nothing is mirrored until it is installed.
#
# IPCR is bundled, from Apps/IPCR (its configuration is the forge's), so this app cannot sit beside
# the IPCR app, nor beside IPCR-Forge-AIO (the same, with Gitea and Radicle bundled).
#
# The handoff from CI to IPFS is a pull, run by IPCR: jobs run in the forge's own Docker daemon,
# which cannot reach ipcr.localhost (the *host's* loopback). So a workflow pushes to the staging
# registry, which shares that daemon's network namespace and is therefore `localhost:5000` to
# every job, and ipcr-gateway polls it over ci-internal. Only this forge's runner sees it: hence
# its own label, `ipcr`, beside the Gitea app's runner and its usual labels.

services:
  # ═══ Bridge — the forge's page, and Gitea → Radicle ════════════════════════════
  # ipcr-forge (forge/ in github.com/Yundera/ipcr-forge). Receives Gitea's system webhook on :8081
  # (internal: no Caddy route) and mirrors every public repository to the Radicle app's node,
  # with the stock `rad` CLI against the node's own home. Serves the forge's page on :8080.
  # Its install step (forge-setup, below) mints its Gitea token and registers the webhook.
  ipcr-forge:
    image: ghcr.io/yundera/ipcr-forge:0.6.2
    container_name: ipcr-forge
    user: $PUID:$PGID
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["ipcr-forge", "serve"]
    cpu_shares: 30
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      TZ: $TZ
      GITEA_URL: http://gitea:3000
      # The Gitea site admin the setup step signs in as (FORGE_GITEA_PASSWORD, default the server's
      # app password); the forge's tokens belong to it.
      GITEA_OWNER: ${FORGE_GITEA_ADMIN:-gitea_admin}
      SECRETS_DIR: /secrets
      STATE_DIR: /forge
      RAD_HOME: /radicle-home
      IPCR_PUBLISHED: /srv/ipcr-state/published.json
      RECONCILE: 10m
      # Admin pages (/admin): Gitea site admins only, signed in through Gitea (an OAuth2 app the
      # forge-setup step registers, one redirect URI per host below). They manage IPCR through its
      # admin API (on ipcr-admin) and back up the publisher key, read from Kubo's keystore.
      PUBLIC_HOSTS: ipcr-forge-${APP_DOMAIN},ipcr-forge-${APP_PUBLIC_IP_DASH}.nip.io,ipcr-forge-${APP_PUBLIC_IP_DASH}.sslip.io
      IPCR_ADMIN: http://ipcr-gateway:4769
      IPCR_ADMIN_TOKEN_FILE: /srv/ipcr-state/admin-token
      KUBO_KEYSTORE: /srv/ipcr-keystore
      IMPORT_PUBLISHER: ${IPCR_IMPORT_PUBLISHER:-forge}
      # The organisation published at the root of the forge's name (metadec/app → …/app), until
      # changed in the admin pages. Its members, through Gitea teams, are who can publish there.
      IPCR_ROOT_ORG: ${IPCR_ROOT_ORG:-}
    tmpfs:
      # HOME for git and rad.
      - /tmp
    volumes:
      # The Radicle app's node home: its storage (where repositories are created and pushed), its
      # control socket (announces) and its key, which signs everything it publishes. The same mount
      # the Radicle app's radicle-api has. Empty until that app is installed: the forge then
      # mirrors nothing, and says so on its page.
      - ${DATA_ROOT:-/DATA}/AppData/radicle/home/:/radicle-home/
      # repos.json (Gitea repository → Radicle ID) and one bare mirror per repository.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/forge/state:/forge
      # The Gitea token and the webhook secret the install step writes. Read-only here.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/forge/secrets:/secrets:ro
      # published.json → /images.json, and the admin API's token. Read-only.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ipcr/state:/srv/ipcr-state:ro
      # Kubo's keystore, read-only: the publisher key, for encrypted backups (Kubo exports keys
      # from its CLI only, and ipcrd, root without capabilities, cannot read a $PUID 0700 folder).
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ipcr/kubo/keystore:/srv/ipcr-keystore:ro
    healthcheck:
      test: ["CMD", "ipcr-forge", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - 8080
      - 8081
    labels:
      caddy_0: ipcr-forge-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 8080}}"
      caddy_1: ipcr-forge-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 8080}}"
      caddy_2: ipcr-forge-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 8080}}"
    networks:
      - pcs
      # To IPCR's admin API only.
      - ipcr-admin

  # ═══ CI — Gitea Actions ════════════════════════════════════════════════════════

  # The runner: act_runner (plain, not its -dind variant) driving the separate daemon below over a
  # unix socket. Runs unprivileged; whoever controls it controls that daemon, which is the point.
  # Its config (seed/runner-config/config.yaml) puts jobs on the daemon's host network, where
  # the staging registry is localhost:5000.
  forge-runner:
    image: gitea/act_runner:0.6.1
    container_name: forge-runner
    user: $PUID:$PGID
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # The stock run.sh reads the registration token once and gives up after 10 tries; the token is
    # fetched from Gitea's API by forge-setup, which runs after the stack is up (and only once the
    # Gitea app answers). So wait for it (or for an
    # existing registration) first.
    entrypoint:
      - /sbin/tini
      - --
      - sh
      - -c
      - |
        until [ -s /data/token ] || [ -s /data/.runner ]; do echo "waiting for the runner registration token"; sleep 2; done
        until [ -S /run/dind/docker.sock ]; do sleep 1; done
        exec run.sh
    cpu_shares: 20
    deploy:
      resources:
        limits:
          # act_runner holds a job's checkout and actions in memory while it copies them into the
          # job container: 256M was OOM-killed mid-job on the first build (holyhorse, 2026-10-04).
          memory: 1G
    environment:
      TZ: $TZ
      HOME: /data
      DOCKER_HOST: unix:///run/dind/docker.sock
      # Handed to every job as GITHUB_SERVER_URL, and jobs run on the daemon's network where
      # `gitea` does not resolve: checkout goes out and back over HTTPS.
      GITEA_INSTANCE_URL: https://gitea-${APP_DOMAIN}
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /data/token
      GITEA_RUNNER_NAME: ipcr-forge-runner
      # Registration-time labels; runner-config/config.yaml repeats them and wins on every start.
      # `ipcr` only: ordinary CI stays on the Gitea app's own runner (gitea-runner).
      GITEA_RUNNER_LABELS: ipcr:docker://docker.gitea.com/runner-images:ubuntu-latest
      CONFIG_FILE: /config/config.yaml
    volumes:
      # .runner (this runner's registration) and the registration token forge-setup leaves.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/runner:/data
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/runner-config:/config:ro
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ci/socket:/run/dind
    depends_on:
      - forge-docker
    networks:
      # Egress: it polls Gitea through its public address, like the jobs.
      - ci-internal

  # The daemon jobs run in: Docker-in-Docker, so jobs and the images they build never touch the
  # host's daemon. See rationale.md for what `privileged` buys and what it costs. No TCP listener:
  # its only API is a unix socket in a folder shared with forge-runner, owned by $PGID.
  forge-docker:
    image: docker:29.1-dind
    container_name: forge-docker
    privileged: true
    restart: unless-stopped
    cpu_shares: 20
    command: ["--host=unix:///run/dind/docker.sock", "--group=$PGID"]
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      TZ: $TZ
      # No certificates: with an explicit --host the entrypoint adds no TCP listener to protect.
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ci/socket:/run/dind
      # The daemon's image store. Without it every restart re-pulls every job image.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ci/docker:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///run/dind/docker.sock", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ci-internal

  # The staging registry's front door: `localhost:5000` to the daemon and to every job (act runs
  # jobs on the host network, which is this namespace), forge-docker:5000 to ipcr-gateway. Plain
  # HTTP, which Docker allows to localhost only. It checks a login on every request: a job logs in
  # as its repository (<owner>/<repo>, the IPCR_PUSH_TOKEN secret the forge service sets on it) and may
  # push that name only; IPCR logs in as the importer (state/staging-auth, which it generates).
  # Same image as the forge service (`ipcr-forge gate`, forge/gate.go in ipcr-forge). See rationale.md.
  forge-gate:
    image: ghcr.io/yundera/ipcr-forge:0.6.2
    container_name: forge-gate
    user: $PUID:$PGID
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    network_mode: service:forge-docker
    command: ["ipcr-forge", "gate"]
    cpu_shares: 20
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      TZ: $TZ
      GATE_LISTEN: ":5000"
      GATE_UPSTREAM: unix:///run/staging/registry.sock
      GATE_CREDENTIALS: /gate/credentials.json
    volumes:
      # Hashes only, written by the forge service.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/forge/state/gate:/gate:ro
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ci/registry-socket:/run/staging
    depends_on:
      - forge-docker
      - forge-registry

  # The staging registry itself: no network at all. It listens on a unix socket in a folder only the
  # gate also mounts, so nothing reaches it but through the gate: not a job, which runs in the
  # daemon above and sees neither the folder nor a port.
  forge-registry:
    image: registry:3.0.0
    container_name: forge-registry
    user: $PUID:$PGID
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    network_mode: none
    # Garbage collection frees the blobs of deleted tags, and must not run while the registry
    # serves: so it runs at every start, before serving.
    entrypoint: ["sh", "-c", "registry garbage-collect --delete-untagged /etc/distribution/config.yml; exec registry serve /etc/distribution/config.yml"]
    cpu_shares: 20
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      TZ: $TZ
      REGISTRY_HTTP_NET: unix
      REGISTRY_HTTP_ADDR: /run/staging/registry.sock
      # Upload URLs relative to the request, whatever Host the gate passes on.
      REGISTRY_HTTP_RELATIVEURLS: "true"
      # Staging only: IPCR has its own copy once imported, and deletes each tag it has published
      # (IMPORT_CLEANUP).
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      OTEL_TRACES_EXPORTER: none
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ci/registry:/var/lib/registry
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ci/registry-socket:/run/staging

  # ═══ IPCR — the IPFS container registry ════════════════════════════════════════
  # Verbatim from Apps/IPCR; only its data folder moves to $AppID/ipcr/.

  # ── The registry Docker talks to ────────────────────────────────────────────
  # ipcrd: TLS front door on 127.0.0.1:4767. Passes /ipfs/<cid> through to the stock nerdctl
  # registry below, resolves /ipns/<name>:<tag> itself, and pins every image it serves.
  ipcr-gateway:
    image: ghcr.io/yundera/ipcr:1.6.0
    container_name: ipcr-gateway
    # Root for one reason: it writes its CA into the host's Docker trust store (the narrow
    # bind below), which is root-owned. See rationale.md.
    user: "0:0"
    # Root needs no capabilities to write root-owned files it owns; drop them all.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["gateway"]
    environment:
      TZ: $TZ
      TLS_DIR: /data/tls
      # Docker trusts certs.d/<host:port>/ca.crt and re-reads it on every pull.
      CA_EXPORT: /certs.d/ipcr.localhost:4767/ca.crt
      # Pin every image this host pulls, so the node keeps — and re-shares — what it runs.
      AUTO_PIN: "true"
      # Optional: follow a registry. Every tag of every repository it lists (or of
      # IPCR_IMPORT_REPOS) is copied into IPFS and published as /ipns/<owner-repo>:<tag>;
      # a tag is re-imported when it moves. Empty = off. IPCR_IMPORT_AUTH is user:token,
      # a read-only (read:package) token is enough.
      # Forge: watch the CI's staging registry, over ci-internal. Internal, so no credentials.
      IMPORT_WATCH: ${IPCR_IMPORT_WATCH:-http://forge-docker:5000}
      IMPORT_AUTH: ${IPCR_IMPORT_AUTH:-}
      # Forge: IPCR's login at the staging registry's gate, generated on first start; the forge service
      # reads it (read-only ipcr/state) and gives it the importer's rights at the gate.
      IMPORT_AUTH_FILE: /data/state/staging-auth
      IMPORT_AUTH_GENERATE: "true"
      IMPORT_REPOS: ${IPCR_IMPORT_REPOS:-}
      # Forge: every repository this node builds is published under one IPNS key, "forge", as
      # /ipns/<forge key>/<repo>:<tag>. One name for the whole forge, which a DNSLink domain or an
      # ENS name can point at: ipcr.localhost:4767/ipns/example.eth/<repo>:<tag>.
      IMPORT_PUBLISHER: ${IPCR_IMPORT_PUBLISHER:-forge}
      # Forge: publish only the repositories the forge service allows (public Gitea repositories, minus
      # those switched off in the admin pages). Until the forge service sends its list, nothing is.
      IMPORT_ALLOW_REQUIRED: "true"
      # Forge: delete each tag from the staging registry once published (its blobs go at the
      # registry's next start, see forge-registry).
      IMPORT_CLEANUP: "true"
      # IPNS records valid 7 days instead of Kubo's 48 h, so a forge offline for a weekend keeps
      # its name; resolvers cache them 5 minutes, so a new tag shows up quickly.
      IPNS_LIFETIME: ${IPCR_IPNS_LIFETIME:-168h}
      IPNS_TTL: 5m
      # Forge: the admin API, for the forge service, on ipcr-admin. Bearer token in state/admin-token.
      ADMIN_LISTEN: ":4769"
      IMPORT_INTERVAL: 60s
      STATE_DIR: /data/state
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ipcr/tls:/data/tls
      # What the watcher already imported (tag → manifest digest).
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ipcr/state:/data/state
      # The host's Docker trust store, so the CA above can be dropped into it: no daemon
      # reload, no daemon.json edit. The parent is mounted because Compose cannot create a
      # bind source whose name contains a colon (ipcr.localhost:4767). ipcrd writes exactly
      # one file here. See rationale.md.
      - /etc/docker/certs.d:/certs.d
    ports:
      # Loopback only: the client is the host's Docker daemon, which resolves ipcr.localhost
      # to 127.0.0.1 (RFC 6761). Not reachable from the network, and not a web UI.
      - "127.0.0.1:4767:4767"
    depends_on:
      - ipcr-registry
    healthcheck:
      test: ["CMD", "ipcrd", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ipcr-internal
      # Forge only: reaches the staging registry for the import poller above.
      - ci-internal
      # Forge only: the admin API, reached by the forge service.
      - ipcr-admin
    cpu_shares: 50
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Public front door ───────────────────────────────────────────────────────
  # Forge only: the same ipcrd, a second process, serving the registry API to anyone at
  # ipcr-<domain>, read-only, for this forge's own images only (gateway/public.go): its publisher
  # name, its verified ENS/DNS name, its published image roots. Everything else is 404, so nobody
  # can make this node fetch other IPFS content. `docker pull ipcr-<domain>/ipns/<name>/<repo>:<tag>`
  # then works on any machine, without IPCR. A pull here pins nothing. The admin pages switch it
  # off (config.json "public": false). Not on the admin or CI networks. See rationale.md.
  ipcr-public:
    image: ghcr.io/yundera/ipcr:1.6.0
    container_name: ipcr-public
    user: $PUID:$PGID
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["gateway"]
    environment:
      TZ: $TZ
      # Plain HTTP: Caddy terminates TLS (no TLS_DIR, no CA to export).
      LISTEN: ":4770"
      AUTO_PIN: "false"
      PUBLIC_POLICY: /data/state
    volumes:
      # published.json and config.json, written by ipcr-gateway. Read-only.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ipcr/state:/data/state:ro
    depends_on:
      - ipcr-registry
    healthcheck:
      test: ["CMD", "ipcrd", "health", "http://127.0.0.1:4770/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - 4770
    labels:
      caddy_0: ipcr-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 4770}}"
      caddy_1: ipcr-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 4770}}"
      caddy_2: ipcr-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 4770}}"
    networks:
      - pcs
      - ipcr-internal
    cpu_shares: 30
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Stock nerdctl IPFS registry ─────────────────────────────────────────────
  # `nerdctl ipfs registry serve`, unmodified: translates the registry API into IPFS reads.
  ipcr-registry:
    image: ghcr.io/yundera/ipcr:1.6.0
    container_name: ipcr-registry
    # Root because nerdctl run as any other uid assumes rootless mode and refuses to start
    # without a rootless containerd — which `ipfs registry serve` never uses. The service has
    # no volumes and no host access; capabilities are all dropped. See rationale.md.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["registry"]
    environment:
      TZ: $TZ
    expose:
      - 5050
    depends_on:
      - ipcr-kubo
    healthcheck:
      test: ["CMD", "ipcrd", "health", "http://127.0.0.1:5050/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ipcr-internal
    cpu_shares: 50
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Kubo, the IPFS node ─────────────────────────────────────────────────────
  ipcr-kubo:
    image: ipfs/kubo:v0.43.1
    container_name: ipcr-kubo
    user: $PUID:$PGID
    restart: unless-stopped
    # --enable-gc: blocks nobody pinned are collected; pinned images are never touched.
    command: ["daemon", "--migrate=true", "--agent-version-suffix=docker", "--enable-gc"]
    environment:
      TZ: $TZ
      # Applied at `ipfs init` only: DHT client mode, small connection manager. Tuned for an
      # always-on small box (see the Kubo store app for measurements).
      IPFS_PROFILE: lowpower
      GOMEMLIMIT: 768MiB
      # Read by seed/init.d/01-ipcr-node.sh on every start.
      IPCR_SWARM_PORT: "4768"
      IPFS_STORAGE_MAX: 20GB
    volumes:
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ipcr/kubo/:/data/ipfs
      # Kubo's entrypoint runs every *.sh here before starting the daemon.
      - ${DATA_ROOT:-/DATA}/AppData/$AppID/ipcr/init.d/:/container-init.d:ro
    expose:
      # RPC API: no auth, so it never leaves the app's own network.
      - 5001
    ports:
      # libp2p swarm — the peer protocol, not HTTP, so Caddy cannot carry it. Without it the
      # node still pulls, but nobody can fetch the images this host pins. 4001 is left to the
      # Kubo store app so both can be installed side by side.
      - "4768:4768/tcp"
      - "4768:4768/udp"
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api=/ip4/127.0.0.1/tcp/5001 id > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ipcr-internal
    cpu_shares: 50
    deploy:
      resources:
        limits:
          memory: 1024M

networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true
  # CI: the runner ↔ its daemon (and staging registry) ↔ ipcr-gateway; egress for builds.
  ci-internal:
    driver: bridge
  # From Apps/IPCR: gateway ↔ registry ↔ kubo, nothing else.
  ipcr-internal:
    driver: bridge
  # Bridge → IPCR's admin API, nothing else; no egress.
  ipcr-admin:
    driver: bridge
    internal: true


x-casaos:
  architectures:
    - amd64
  main: ipcr-forge
  author: Yundera
  developer: Yundera
  category: Developer
  tags: ["developer", "git", "ci", "needs-public-ip"]
  icon: icon.png
  screenshot_link:
    - screenshot-1.png
    - screenshot-2.png
    - screenshot-3.png
  title:
    en_us: IPCR Forge
  tagline:
    en_us: Your Gitea's releases, served from IPFS; its code mirrored to Radicle.
    fr_fr: Les versions de votre Gitea servies depuis IPFS, son code répliqué sur Radicle.
  description:
    en_us: |
      IPCR Forge turns the **Gitea** app into a forge whose releases do not depend on it staying
      online:

      • **IPCR** publishes every image your Gitea workflows build on IPFS, so any server running
        IPCR can `docker pull` it by name, from whichever peers hold it.
      • With the **Radicle** app installed too, every public repository is copied, signed by this
        server, to Radicle's peer-to-peer network: anyone can clone it, even when this server is
        down.

      **Requires the Gitea app.** Radicle is optional, and can be added later. Already running
      neither? **IPCR Forge (AIO)** bundles both.

      A repository publishes images by committing a workflow under `.gitea/workflows/` that runs
      on `ipcr` and pushes to `localhost:5000`. The install creates an example, `ipcr-hello`:
      create a tag on it in Gitea and watch the whole chain run.

      The forge's own page (it opens from the tile) explains how to publish, lists every published
      image with the line to put in a compose file, and every repository mirrored to Radicle.

      This app bundles IPCR: install it instead of the IPCR app, not beside it.
    fr_fr: |
      IPCR Forge fait de l'application **Gitea** une forge dont les versions publiées ne dépendent
      pas de sa disponibilité :

      • **IPCR** publie sur IPFS chaque image construite par vos workflows Gitea : tout serveur
        équipé d'IPCR peut la `docker pull` par son nom, depuis les pairs qui la détiennent.
      • Avec l'application **Radicle** installée aussi, chaque dépôt public est copié, signé par ce
        serveur, sur le réseau pair-à-pair Radicle : n'importe qui peut le cloner, même quand ce
        serveur est arrêté.

      **Nécessite l'application Gitea.** Radicle est facultatif, et peut être ajouté plus tard.
      Aucune des deux installée ? **IPCR Forge (AIO)** les regroupe.

      Un dépôt publie des images en ajoutant un workflow sous `.gitea/workflows/` qui tourne sur
      `ipcr` et pousse vers `localhost:5000`. L'installation crée un exemple, `ipcr-hello` :
      créez-y un tag dans Gitea et regardez toute la chaîne s'exécuter.

      La page de la forge (elle s'ouvre depuis la tuile) explique comment publier, liste chaque
      image publiée avec la ligne à mettre dans un fichier compose, et chaque dépôt répliqué sur
      Radicle.

      Cette application regroupe IPCR : installez-la à la place de l'application IPCR, pas à côté.
  tips:
    before_install:
      en_us: |
        **Install the Gitea app first.** This forge uses it: its repositories, its users, its
        Actions. The forge signs in once as `gitea_admin` with your default app password; if you
        changed it, set `FORGE_GITEA_ADMIN` / `FORGE_GITEA_PASSWORD` in this app's settings (a Gitea
        site administrator). The forge's page says when it cannot reach or sign in to Gitea.

        **Radicle is optional.** Install the Radicle app, before or after, and every public
        repository is mirrored within ten minutes. Without it, nothing is mirrored.

        **Workflows run on `ipcr`.** This forge brings its own runner, the only one that reaches the
        staging registry; the Gitea app's runner keeps the usual labels (`ubuntu-latest`, …) for
        ordinary CI. A publishing workflow says `runs-on: ipcr` (the example does).

        **Start here: [the forge's page](https://ipcr-forge-$APP_DOMAIN)**: how to publish, the
        published images, the Radicle mirrors.

        **Admin: [ipcr-forge-$APP_DOMAIN/admin](https://ipcr-forge-$APP_DOMAIN/admin)**, signed in
        with Gitea (site administrators only): your ENS or DNS name, health of the published name,
        unpublishing images, which repositories may publish, and the **publisher key backup**.
        Download one after the first release: the key exists only on this server, and losing it
        loses every image name.

        **Replaces the IPCR app** (same addresses and ports): uninstall it first.

        | Address | What |
        | --- | --- |
        | `https://ipcr-forge-$APP_DOMAIN` | The forge's page (opens from the tile, public) |
        | `https://gitea-$APP_DOMAIN` | Gitea (the Gitea app) |
        | `ipcr-$APP_DOMAIN` | `docker pull` this forge's images from anywhere, without IPCR (read-only) |
        | `ipcr.localhost:4767` | IPCR registry, this server's Docker only |

        **Ports.** 4768 TCP+UDP (IPFS peers) is published.

        **Public repositories go to Radicle** once the Radicle app is installed. Every public Gitea
        repository is copied there, signed by this server, within seconds of each push. That cannot
        be undone: making a repository private later stops the copy, and what was published stays
        on the network. Private repositories are never copied.

        **Who can publish images.** Each public repository (switched on in the admin pages: all are,
        by default) publishes under its own name, `<owner>/<repo>`: its workflow logs in to the
        staging registry with the `IPCR_PUSH_TOKEN` secret the forge sets on it. The repositories of
        the root organisation (`IPCR_ROOT_ORG`, then the admin pages) are also published at the root,
        `<repo>`: its members decide who publishes there. Workflows from forks get no secrets.
        CI runs on a privileged Docker daemon: only give write access to people you trust with the
        server.
      fr_fr: |
        **Installez d'abord l'application Gitea.** Cette forge l'utilise : ses dépôts, ses
        utilisateurs, ses Actions. La forge s'y connecte une fois comme `gitea_admin` avec votre mot
        de passe d'applications par défaut ; si vous l'avez changé, renseignez `FORGE_GITEA_ADMIN` /
        `FORGE_GITEA_PASSWORD` dans les réglages de cette application (un administrateur du site
        Gitea). La page de la forge signale quand elle ne peut pas joindre Gitea ou s'y connecter.

        **Radicle est facultatif.** Installez l'application Radicle, avant ou après, et chaque dépôt
        public est répliqué dans les dix minutes. Sans elle, rien n'est répliqué.

        **Les workflows tournent sur `ipcr`.** Cette forge apporte son propre runner, le seul qui
        atteint le registre de transit ; celui de l'application Gitea garde les étiquettes
        habituelles (`ubuntu-latest`, …) pour la CI ordinaire. Un workflow de publication indique
        `runs-on: ipcr` (l'exemple le fait).

        **Commencez ici : [la page de la forge](https://ipcr-forge-$APP_DOMAIN)** : publier, les
        images publiées, les copies Radicle.

        **Administration : [ipcr-forge-$APP_DOMAIN/admin](https://ipcr-forge-$APP_DOMAIN/admin)**,
        connexion via Gitea (administrateurs du site uniquement) : votre nom ENS ou DNS, l'état du
        nom publié, le retrait d'images, les dépôts autorisés à publier, et la **sauvegarde de la
        clé de publication**. Téléchargez-en une après la première version : la clé n'existe que
        sur ce serveur, et la perdre fait perdre tous les noms d'images.

        **Remplace l'application IPCR** (mêmes adresses et ports) : désinstallez-la d'abord.

        | Adresse | Quoi |
        | --- | --- |
        | `https://ipcr-forge-$APP_DOMAIN` | La page de la forge (s'ouvre depuis la tuile, publique) |
        | `https://gitea-$APP_DOMAIN` | Gitea (l'application Gitea) |
        | `ipcr-$APP_DOMAIN` | `docker pull` des images de cette forge depuis n'importe où, sans IPCR (lecture seule) |
        | `ipcr.localhost:4767` | Registre IPCR, pour le Docker de ce serveur uniquement |

        **Ports.** 4768 TCP+UDP (pairs IPFS) est publié.

        **Les dépôts publics partent sur Radicle** une fois l'application Radicle installée. Chaque
        dépôt public de Gitea y est copié, signé par ce serveur, quelques secondes après chaque
        push. C'est irréversible : rendre un dépôt privé ensuite arrête la copie, et ce qui a été
        publié reste sur le réseau. Les dépôts privés ne sont jamais copiés.

        **Qui peut publier des images.** Chaque dépôt public (activé dans l'administration : tous,
        par défaut) publie sous son propre nom, `<propriétaire>/<dépôt>` : son workflow se connecte
        au registre de transit avec le secret `IPCR_PUSH_TOKEN` que la forge y dépose. Les dépôts de
        l'organisation racine (`IPCR_ROOT_ORG`, puis l'administration) sont aussi publiés à la
        racine, `<dépôt>` : ses membres décident qui y publie. Les workflows des forks n'ont pas de
        secrets. La CI tourne sur un démon Docker privilégié : ne donnez l'accès en écriture qu'à des
        personnes à qui vous confiez le serveur.
  index: /
  webui_port: 8080
  store_app_id: ipcr-forge

x-compose-app:
  schema_version: 2
  folders:
    # ── Bridge ──
    - path: /DATA/AppData/$AppID/forge/state
      user: $PUID
      group: $PGID
    - path: /DATA/AppData/$AppID/forge/secrets
      user: $PUID
      group: $PGID
      mode: "0700"
    # The gate's credentials (hashes), written by the forge service, read by the gate.
    - path: /DATA/AppData/$AppID/forge/state/gate
      user: $PUID
      group: $PGID
    # ── Radicle (the Radicle app's) ──
    # The Radicle app's home, which the forge service mounts. Created here, as $PUID, so that Docker
    # does not create it as root when the Radicle app is not installed yet: its install step
    # (`rad auth`, as $PUID) could then not write the node's key. Outside this app's folder, so
    # uninstalling the forge leaves it alone.
    - path: /DATA/AppData/radicle/home
      user: $PUID
      group: $PGID
    # ── CI runner ──
    # Holds .runner (the runner's registration) and the token forge-setup leaves.
    - path: /DATA/AppData/$AppID/runner
      user: $PUID
      group: $PGID
      mode: "0700"
    - path: /DATA/AppData/$AppID/runner-config
      user: $PUID
      group: $PGID
    # ── CI daemon ──
    # The daemon's socket: created by root, group $PGID (dockerd --group), mode 0660.
    - path: /DATA/AppData/$AppID/ci/socket
      user: $PUID
      group: $PGID
      mode: "0750"
    - path: /DATA/AppData/$AppID/ci/docker
      user: $PUID
      group: $PGID
      mode: "0710"
    - path: /DATA/AppData/$AppID/ci/registry
      user: $PUID
      group: $PGID
      mode: "0700"
    # The staging registry's socket: the registry and the gate only.
    - path: /DATA/AppData/$AppID/ci/registry-socket
      user: $PUID
      group: $PGID
      mode: "0700"
    # ── IPCR ──
    - path: /DATA/AppData/$AppID/ipcr/kubo
      user: $PUID
      group: $PGID
      mode: "0700"
    # Created ahead of Kubo's first start: the forge service mounts it, and Docker would otherwise create
    # it as root, where Kubo cannot write its keys.
    - path: /DATA/AppData/$AppID/ipcr/kubo/keystore
      user: $PUID
      group: $PGID
      mode: "0700"
    - path: /DATA/AppData/$AppID/ipcr/init.d
      user: $PUID
      group: $PGID
  files:
    # Both follow store updates (re-rendered on every up).
    - path: /DATA/AppData/$AppID/runner-config/config.yaml
      from: runner-config/config.yaml
      ensure: always
      mode: "0644"
    - path: /DATA/AppData/$AppID/ipcr/init.d/01-ipcr-node.sh
      from: ipcr/init.d/01-ipcr-node.sh
      ensure: always
      mode: "0755"
  init:
    # The forge service's Gitea tokens (public-only read; and write:repository for push secrets), the
    # webhook secret, the system webhook, the admin pages' OAuth2 app, the root organisation, the
    # example repository (in that organisation) and, until the runner is registered, its
    # registration token (Gitea's API: this app cannot run `gitea` on the Gitea app's volume).
    # Idempotent, so on every start: it repairs the webhook. The admin password is used here only,
    # never stored. Waits up to 240s for the Gitea app, then records why it could not go on
    # (forge/secrets/setup-status, shown on the forge's page) and lets the start finish.
    - name: forge-setup
      image: ghcr.io/yundera/ipcr-forge:0.6.2
      user: $PUID:$PGID
      phase: post_up
      network: $APP_NET
      volumes:
        - /DATA/AppData/$AppID/forge/secrets:/secrets
        - /DATA/AppData/$AppID/runner:/runner
      command:
        - sh
        - -c
        - GITEA_OWNER="${FORGE_GITEA_ADMIN:-gitea_admin}" GITEA_PASSWORD="${FORGE_GITEA_PASSWORD:-$APP_DEFAULT_PASSWORD}" GITEA_URL=http://gitea:3000 RUNNER_DIR=/runner IPCR_ROOT_ORG="${IPCR_ROOT_ORG:-}" PUBLIC_HOSTS="ipcr-forge-$APP_DOMAIN,ipcr-forge-$APP_PUBLIC_IP_DASH.nip.io,ipcr-forge-$APP_PUBLIC_IP_DASH.sslip.io" ipcr-forge setup
      when: always
  webui-host: ipcr-forge-${domain}
  webui-path: /
