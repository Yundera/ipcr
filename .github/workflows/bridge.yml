name: bridge

# IPCR Forge's bridge image (bridge/): Gitea → Radicle mirror + the forge's page.
on:
  push:
    branches: [main]
    tags: ["bridge-v*"]
    paths: ["bridge/**", ".github/workflows/bridge.yml"]
  pull_request:
    paths: ["bridge/**", ".github/workflows/bridge.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yundera/ipcr-forge-bridge

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
        working-directory: bridge

  image:
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=bridge-v(.*),group=1
            type=ref,event=branch
            type=sha
      # amd64 only: the Radicle CLI is fetched as its x86_64 release, and the Forge listing is
      # amd64 only.
      - uses: docker/build-push-action@v6
        with:
          context: bridge
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,mode=max,scope=bridge
