name: rad-actions

# The Forge's CI image (ci/): radicle-ci-broker + act + the rad-actions adapter.
on:
  push:
    branches: [main]
    tags: ["rad-actions-v*"]
    paths: ["ci/**", ".github/workflows/rad-actions.yml"]
  pull_request:
    paths: ["ci/**", ".github/workflows/rad-actions.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yundera/rad-actions

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ci/adapter/go.mod
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
        working-directory: ci/adapter

  image:
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=rad-actions-v(.*),group=1
            type=ref,event=branch
            type=sha
      # amd64 only: cib is a Rust build that takes most of an hour under QEMU, and the Forge
      # listing is amd64 only.
      - uses: docker/build-push-action@v6
        with:
          context: ci
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=rad-actions
          cache-to: type=gha,mode=max,scope=rad-actions
